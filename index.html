<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DESIGN VAULT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400&family=Black+Ops+One&display=swap" rel="stylesheet">
    <style>
      /* CSS reset */
      *, *::before, *::after { box-sizing: border-box; }
      * { margin: 0; padding: 0; }
      body { line-height: 1.5; }
      img, picture, video, canvas, svg { display: block; max-width: 100%; }
      input, button, textarea, select { font: inherit; }
      h1, h2, h3, h4, h5, h6 { font-size: inherit; font-weight: inherit; }
      /* Requested font */
      body { font-family: "Barlow Condensed", sans-serif; font-size: 1rem; }
      body { position: relative; min-height: 100svh; }
      .page-layout {
        display: grid;
        /* Two tracks per coordinate cell allow exact half-cell edges. */
        grid-template-columns: repeat(24, minmax(0, 1fr));
        grid-template-rows: repeat(24, minmax(0, 1fr));
        height: 100svh;
        min-height: 100svh;
        background: #333333;
      }
      .dashboard {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        grid-template-rows: repeat(12, minmax(0, 1fr));
        grid-column: 1 / 7;
        grid-row: 1 / -1;
        background: #333333;
        color: #ffffff;
      }
      .logo {
        grid-column: 1 / 3;
        grid-row: 1;
        display: grid;
        place-items: center;
        text-align: center;
        font-family: "Black Ops One", sans-serif;
      }
      .dashboard-placeholders {
        grid-column: 1 / -1;
        grid-row: 2 / 10;
        display: grid;
        grid-template-rows: repeat(8, minmax(0, 1fr));
        list-style: none;
      }
      .dashboard-placeholders li {
        display: grid;
        place-items: center;
      }
      .workspace-toolbar {
        grid-column: 7 / 24;
        grid-row: 2 / 3;
        background: #f5f2eb;
      }
      .workspace {
        grid-column: 7 / 24;
        grid-row: 3 / 24;
        min-width: 0;
        min-height: 0;
        overflow: auto;
        background: #ffffff;
      }
      .scale-alphabet { white-space: nowrap; }
      .frame-edge {
        position: absolute;
        background: #333333;
        pointer-events: none;
      }
      .frame-top, .frame-bottom {
        left: 25%;
        right: 0;
        height: calc(100% / 24);
      }
      .frame-top { top: 0; }
      .frame-bottom { bottom: 0; }
      .frame-right {
        top: 0;
        right: 0;
        bottom: 0;
        width: calc(100% / 24);
      }
      .coordinate-grid {
        pointer-events: none;
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-columns: repeat(12, minmax(0, 1fr));
        grid-template-rows: repeat(12, minmax(0, 1fr));
        border-top: 2px dotted #001f54;
        border-left: 2px dotted #001f54;
        color: #001f54;
      }
      .coordinate-grid[hidden] { display: none; }
      .grid-cell {
        display: flex;
        align-items: flex-end;
        justify-content: flex-end;
        min-width: 0;
        min-height: 0;
        border-right: 2px dotted #001f54;
        border-bottom: 2px dotted #001f54;
        padding: 2px 4px;
        font-size: clamp(12px, 1.1vw, 16px);
        line-height: 1;
      }
      .grid-cell.is-selected { background: rgb(0 31 84 / 9%); }
      .grid-controls {
        position: absolute;
        right: max(16px, env(safe-area-inset-right));
        bottom: max(16px, env(safe-area-inset-bottom));
        display: flex;
        align-items: flex-end;
        flex-direction: column;
        gap: 8px;
        color: #001f54;
      }
      .grid-coordinate {
        background: #fff;
        padding: 2px 8px;
        font-size: 20px;
      }
      .grid-toggle {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 52px;
        padding: 8px 16px;
        border: 1px solid #001f54;
        border-radius: 6px;
        color: #001f54;
        background: #fff;
        font-size: 26px;
        cursor: pointer;
      }
      .grid-toggle::after {
        content: "";
        width: 12px;
        height: 12px;
        border: 1px solid currentColor;
        border-radius: 50%;
      }
      .grid-toggle[aria-pressed="true"]::after { background: currentColor; }
      .grid-toggle:focus-visible { outline: 3px solid #001f54; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <div class="page-layout">
      <aside class="dashboard" aria-label="Dashboard">
        <h1 class="logo">DESIGN VAULT</h1>
        <ol class="dashboard-placeholders" aria-label="Dashboard placeholders">
          <li>Upload Typography</li>
          <li>Font Count</li>
          <li>
            <div>
              <label for="scale-ratio">Modular Scale</label>
              <select id="scale-ratio">
                <option value="none" selected>None</option>
                <option value="minor-second">Minor second · 1.067</option>
                <option value="major-second">Major second · 1.125</option>
                <option value="minor-third">Minor third · 1.2</option>
                <option value="major-third">Major third · 1.25</option>
                <option value="perfect-fourth">Perfect fourth · 1.333</option>
                <option value="augmented-fourth">Augmented fourth · 1.414</option>
                <option value="perfect-fifth">Perfect fifth · 1.5</option>
                <option value="minor-sixth">Minor sixth · 1.6</option>
                <option value="golden-ratio">Golden ratio · 1.618</option>
                <option value="major-sixth">Major sixth · 1.667</option>
                <option value="minor-seventh">Minor seventh · 1.778</option>
                <option value="major-seventh">Major seventh · 1.875</option>
                <option value="octave">Octave · 2</option>
              </select>
            </div>
          </li>
          <li>4</li>
          <li>5</li>
          <li>6</li>
          <li>7</li>
          <li>8</li>
        </ol>
      </aside>
      <div class="workspace-toolbar">
        <label><input type="checkbox" id="scale-view-toggle" aria-controls="font-specimen scale-preview"> Modular Scale</label>
      </div>
      <main class="workspace" aria-label="Color workspace">
        <section aria-labelledby="chosen-font">
          <h2 id="chosen-font">Barlow Condensed</h2>
          <div id="font-specimen">
          <p>ABCDEFGHIJKLMNOPQRSTUVWXYZ</p>
          <p>abcdefghijklmnopqrstuvwxyz</p>
          <p>0123456789</p>
          <p>.,:;!? ' &quot; ‘ ’ “ ” … - – — ( ) [ ] { }</p>
          <p>@ # &amp; * / \ | _ + − = &lt; &gt; % $ £ € © ® ™</p>
          </div>
          <div id="scale-preview" hidden></div>
        </section>
      </main>
    </div>
    <div class="frame-edge frame-top" aria-hidden="true"></div>
    <div class="frame-edge frame-right" aria-hidden="true"></div>
    <div class="frame-edge frame-bottom" aria-hidden="true"></div>
    <div class="coordinate-grid" id="coordinate-grid" aria-hidden="true"></div>
    <div class="grid-controls">
      <output class="grid-coordinate" id="grid-coordinate" aria-live="polite">A–L · 1–12</output>
      <button class="grid-toggle" type="button" aria-pressed="true" aria-controls="coordinate-grid">grid</button>
    </div>
    <script>
      const grid = document.querySelector('#coordinate-grid');
      const toggle = document.querySelector('.grid-toggle');
      const coordinate = document.querySelector('#grid-coordinate');
      const columns = 'ABCDEFGHIJKL';
      for (let row = 1; row <= 12; row++) {
        for (const column of columns) {
          const cell = document.createElement('div');
          cell.className = 'grid-cell';
          cell.textContent = `${column}${row}`;
          grid.append(cell);
        }
      }
      document.addEventListener('pointerdown', (event) => {
        if (grid.hidden || event.target.closest('button, input, select, label')) return;
        const bounds = grid.getBoundingClientRect();
        if (event.clientX < bounds.left || event.clientX >= bounds.right ||
            event.clientY < bounds.top || event.clientY >= bounds.bottom) return;
        const column = Math.floor((event.clientX - bounds.left) / bounds.width * 12);
        const row = Math.floor((event.clientY - bounds.top) / bounds.height * 12);
        const cell = grid.children[row * 12 + column];
        grid.querySelector('.is-selected')?.classList.remove('is-selected');
        cell.classList.add('is-selected');
        coordinate.textContent = cell.textContent;
      });
      toggle.addEventListener('click', () => {
        const visible = toggle.getAttribute('aria-pressed') !== 'true';
        toggle.setAttribute('aria-pressed', String(visible));
        grid.hidden = !visible;
        coordinate.hidden = !visible;
      });
      const scaleRatios = {
        'minor-second': 16 / 15,
        'major-second': 9 / 8,
        'minor-third': 6 / 5,
        'major-third': 5 / 4,
        'perfect-fourth': 4 / 3,
        'augmented-fourth': Math.SQRT2,
        'perfect-fifth': 3 / 2,
        'minor-sixth': 8 / 5,
        'golden-ratio': (1 + Math.sqrt(5)) / 2,
        'major-sixth': 5 / 3,
        'minor-seventh': 16 / 9,
        'major-seventh': 15 / 8,
        'octave': 2,
      };
      const ratioSelect = document.querySelector('#scale-ratio');
      const scaleViewToggle = document.querySelector('#scale-view-toggle');
      const fontSpecimen = document.querySelector('#font-specimen');
      const scalePreview = document.querySelector('#scale-preview');
      function renderScale() {
        fontSpecimen.hidden = scaleViewToggle.checked;
        scalePreview.hidden = !scaleViewToggle.checked;
        scalePreview.replaceChildren();
        const ratio = scaleRatios[ratioSelect.value];
        const steps = ratio ? [6, 5, 4, 3, 2, 1, 0, -1, -2] : [0];
        for (const step of steps) {
          const size = ratio ? ratio ** step : 1;
          const row = document.createElement('div');
          const sizeLabel = document.createElement('p');
          sizeLabel.textContent = `${Number(size.toFixed(3))}rem`;
          const alphabet = document.createElement('p');
          alphabet.className = 'scale-alphabet';
          alphabet.style.fontSize = `${size}rem`;
          alphabet.textContent = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
          row.append(sizeLabel, alphabet);
          scalePreview.append(row);
        }
        document.querySelector('.workspace').scrollTo(0, 0);
      }
      ratioSelect.addEventListener('change', renderScale);
      scaleViewToggle.addEventListener('change', renderScale);
      renderScale();
    </script>
  </body>
</html>
